apiVersion: v1
kind: Service
metadata:
  name: envoy-gateway-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: envoy
    app.kubernetes.io/component: proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: envoy
    app.kubernetes.io/component: proxy
    gateway.envoyproxy.io/owning-gateway-name: eg-gateway
  ports:
    - name: http
      port: 80
      targetPort: 10080
      protocol: TCP
