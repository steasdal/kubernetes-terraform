apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.gatewayClassName }}-proxy-config
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      {{- if .Values.envoyImage }}
      envoyDeployment:
        container:
          image: {{ .Values.envoyImage | quote }}
      {{- end }}
      envoyService:
        type: {{ .Values.serviceType }}
